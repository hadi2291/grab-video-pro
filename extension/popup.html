<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-box">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </div>
        <div>
          <h2>GrabVideo</h2>
          <span class="sub">Sniffer & Grabber</span>
        </div>
      </div>

      <div class="engine-status" id="engineStatus" title="Status koneksi ke Windows Download Manager">
        <span class="dot"></span>
        <span class="status-label">Cek Engine...</span>
      </div>
    </header>

    <!-- App Quick Link -->
    <div class="quick-nav">
      <button class="nav-btn" id="btnOpenDashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        Buka Windows Download Manager
      </button>
    </div>

    <!-- Media Summary Bar -->
    <div class="summary-bar">
      <span class="media-count" id="mediaCount">Mencari media...</span>
      <button class="btn-batch" id="btnDownloadAll" style="display: none;">
        ⚡ Unduh Semua di App
      </button>
    </div>

    <!-- Media List -->
    <main class="media-list" id="mediaList">
      <div class="empty-state" id="emptyState">
        <div class="empty-circle">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="10 8 16 12 10 16 10 8"></polygon>
          </svg>
        </div>
        <p class="empty-title">Belum Ada Video Terdeteksi</p>
        <p class="empty-desc">Coba putar video di halaman ini agar aliran stream terdeteksi oleh sniffer.</p>
      </div>
    </main>

    <!-- Footer Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
